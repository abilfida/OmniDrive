name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Worker tests
        run: npm run test -w packages/worker

      - name: Web tests
        run: npm run test -w packages/web

      - name: Web typecheck and build
        run: npm run build:web

      - name: Node server bundle
        run: npm run build:node -w packages/worker

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build unified image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.unified
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Omnidrive API — Cloudflare Worker Configuration
# Copy this file to wrangler.toml and fill in your values:
#   cp wrangler.example.toml wrangler.toml

name = "omnidrive-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# Required: the worker imports node:crypto and uses Buffer
compatibility_flags = [ "nodejs_compat_v2" ]

[triggers]
crons = ["*/30 * * * *"]

# D1 Database — create with: npx wrangler d1 create omnidrive
[[d1_databases]]
binding = "DB"
database_name = "omnidrive"
database_id = "<your-d1-database-id>"

# KV Namespace — create with: npx wrangler kv namespace create KV
[[kv_namespaces]]
binding = "KV"
id = "<your-kv-namespace-id>"

[vars]
# Public URL of the web app (used for CORS, CSRF checks and share links)
FRONTEND_URL = "https://<your-project>.pages.dev"

# Security secrets — set via:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put TOKEN_ENCRYPTION_KEY
# Generate each with: openssl rand -hex 32
# Never change TOKEN_ENCRYPTION_KEY on a deployment with data: stored Drive
# tokens and S3 keys are encrypted with it.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

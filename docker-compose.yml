services:
  omnidrive:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-abilfida}/omnidrive-unified:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.unified
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set, generate with openssl rand -hex 32}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY must be set, generate with openssl rand -hex 32}
      - FRONTEND_URL=${FRONTEND_URL}
      - WORKER_URL=${WORKER_URL}
      - DATA_DIR=/app/data
      # Set to true only when a reverse proxy in front of this container sets X-Forwarded-For
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - omnidrive-data:/app/data
    restart: unless-stopped

volumes:
  omnidrive-data:
